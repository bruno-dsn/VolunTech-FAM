name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm dist:win --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VolunTech-Windows
          path: release/*.exe
          if-no-files-found: error

      - name: Publish Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true

  macos:
    name: macOS installers
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS DMG
        run: pnpm build && pnpm exec electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Validate macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$DMG"
          echo "DMG gerado: $DMG"
          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          trap 'hdiutil detach "$MOUNT_POINT" -quiet || true; rmdir "$MOUNT_POINT" || true' EXIT
          APP="$MOUNT_POINT/VolunTech.app"
          test -d "$APP"
          echo "Aplicativo encontrado: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/VolunTech"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee /tmp/voluntech-codesign.txt || true
          grep -q 'Signature=adhoc\|code object is not signed at all' /tmp/voluntech-codesign.txt
          echo "Validação macOS concluída: build acadêmico sem assinatura Apple."
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: VolunTech-macOS-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error

      - name: Publish macOS installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg