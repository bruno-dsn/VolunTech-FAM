name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        run: pnpm dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VolunTech-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Publish Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true

  macos:
    name: macOS installers
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS DMG
        run: pnpm build && pnpm exec electron-builder --mac dmg --${{ matrix.arch }}
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: VolunTech-macOS-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
      - name: Publish macOS installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
